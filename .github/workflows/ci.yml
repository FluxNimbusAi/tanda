name: CI

# Honest-green Foundry gate: build + full test suite.
# forge-std is vendored in lib/ (see README "Build from a fresh clone"),
# so no submodule step is needed — CI works from a plain clone.
# Foundry is pinned to v1.9.0 to match the PC/laptop lanes (dist build
# 6056c584, released 2026-11-02).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry (pinned v1.9.0)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Show forge version
        run: forge --version

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vv

  # Python lane for services/nudge_engine.py (stdlib-only, zero network):
  # the 80-test regression suite + the shipped offline self-test gate.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python (pinned 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nudge engine regression suite
        run: python -m unittest discover -s tests -v

      - name: Nudge engine offline self-test
        run: python services/nudge_engine.py --self-test


  # Provenance leg (Flux ruling 2026-11-22; t_flux_c4 draft hardened by
  # t_flux_c2). Rejects commits touching .worktrees/ paths unless the same
  # commit carries a non-empty Provenance-Exempt trailer (6955f050 class),
  # and flags undisclosed --no-verify mentions in commit messages.
  # Draft gaps fixed: depth-1 checkout saw only the tip; concatenated-message
  # greps let one commit's trailer launder another's; exemption was unhandled.
  # Full logic + golden matrix: tools/ci_provenance_gate.py.
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate scans the exact event range; default depth-1 could only
          # ever see the tip. Repo is small (~1.2 MB .git), full fetch is cheap.
          fetch-depth: 0

      - name: Set up Python (pinned 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate self-test (golden matrix)
        run: python tools/ci_provenance_gate.py --self-test

      - name: Provenance gate (worktree guard + --no-verify disclosure)
        env:
          GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GATE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci_provenance_gate.py
